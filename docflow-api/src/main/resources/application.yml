spring:
  application:
    name: docflow-api
  datasource:
    url: jdbc:h2:mem:docflow
    username: sa
    password: sa
  jpa:
    databasePlatform: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true
      path: /h2-console

integration:
  max-repository-size: 100MB
  client:

    github:
        base-url: https://api.github.com
        connect-timeout: 2s
        read-timeout: 5s
        token: ${GITHUB_TOKEN}